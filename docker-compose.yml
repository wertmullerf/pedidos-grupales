name: pedido-grupal

x-server: &server
  build:
    context: .
    dockerfile: apps/server/Dockerfile
  environment: &server-env
    PORT: 3000
    DATABASE_URL: postgres://pedido:pedido@postgres:5432/pedido
    REDIS_URL: redis://redis:6379
    # Compartido por todas las instancias: un token firmado en una se valida en la otra.
    TOKEN_SECRET: ${TOKEN_SECRET:-local-compose-token-secret}
    # Solo nginx es proxy confiable: req.ip = IP que ve nginx, sin aceptar X-Forwarded-For del cliente.
    TRUST_PROXY: '1'
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pedido
      POSTGRES_PASSWORD: pedido
      POSTGRES_DB: pedido
    ports:
      - '5433:5432' # 5433 en el host para no chocar con un Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pedido -d pedido']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

  # Corre migraciones + seed una vez y termina; los servers esperan a que salga OK.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ['sh', '-c', 'node dist/db/migrate.js && node dist/db/seed.js']
    environment: *server-env
    depends_on:
      postgres:
        condition: service_healthy

  # Dos instancias del server para demostrar la sincronización entre instancias.
  server-1:
    <<: *server
    environment:
      <<: *server-env
      INSTANCE_ID: server-1
    ports:
      - '3001:3000' # acceso directo, sin nginx (para probar el Redis adapter)

  server-2:
    <<: *server
    environment:
      <<: *server-env
      INSTANCE_ID: server-2
    ports:
      - '3002:3000'

  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server-1
      - server-2

volumes:
  pgdata:
